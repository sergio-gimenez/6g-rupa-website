{{/* Custom head section */}}

{{/* Include custom CSS */}}
{{ $customCSS := resources.Get "css/custom.css" | resources.Minify }}
<link rel="stylesheet" href="{{ $customCSS.RelPermalink }}">

{{/* Enhanced favicon setup */}}
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

{{/* Enhanced meta tags for social sharing */}}
{{ $logo := resources.Get "img/6grupa-logo.png" }}
{{ with $logo }}
<meta property="og:image" content="{{ .Permalink }}">
<meta name="twitter:image" content="{{ .Permalink }}">
{{ end }}
<meta property="og:description" content="6G-RUPA: A Flexible, Scalable, and Energy-Efficient User Plane Architecture for Next-Generation Mobile Networks">
<meta name="twitter:card" content="summary_large_image">
