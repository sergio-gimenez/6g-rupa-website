# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.135.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Clean Hugo module cache
        run: hugo mod clean
      - name: Get Hugo modules
        run: |
          hugo mod get
          hugo mod tidy
      - name: Vendor Hugo modules
        run: hugo mod vendor
      - name: Verify Hugo modules
        run: hugo mod verify
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Debug vendored modules
        run: |
          echo "Checking vendored modules:"
          ls -la _vendor/github.com/jpanther/congo/v2/layouts/
          echo "Checking shortcodes:"
          ls -la _vendor/github.com/jpanther/congo/v2/layouts/_shortcodes/
          echo "Testing if shortcodes exist:"
          test -f _vendor/github.com/jpanther/congo/v2/layouts/_shortcodes/button.html && echo "button.html exists" || echo "button.html missing"
          test -f _vendor/github.com/jpanther/congo/v2/layouts/_shortcodes/alert.html && echo "alert.html exists" || echo "alert.html missing"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Europe/Madrid
          GOCACHE: ${{ runner.temp }}/go-cache
          GOMODCACHE: ${{ runner.temp }}/go-mod-cache
        run: |
          echo "Current working directory: $(pwd)"
          echo "Hugo version: $(hugo version)"
          echo "Module graph:"
          hugo mod graph
          hugo \
            --gc \
            --minify \
            --ignoreVendorPaths="" \
            --verbose \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
